- alias: "Grafana Alert - Window State"
  id: "grafana_ios_push_window_state"
  triggers:
    - trigger: webhook
      webhook_id: "grafana-vHuNhmA9EfyGO2oFYLCsWpGP"
      allowed_methods:
        - POST
      local_only: true
  actions:
    - action: notify.notify
      data:
        title: "📊 Grafana Monitor"
        message: |
          Updated: {{ now().strftime('%H:%M:%S') }}
          {% if trigger.json.alerts is defined %}
          {% for alert in trigger.json.alerts %}
          🪟 {{ alert.labels.friendly_name | default('Unknown device') }}: {{ '🔴 Open' if alert.status == 'firing' else '🟢 Closed' }}
          {% endfor %}
          {% else %}
          ⚠️ Test signal received (no device data)
          {% endif %}
        data:
          tag: "grafana_alert"
          push:
            interruption-level: active
          presentation_options:
            - alert
            - badge
            - sound
  mode: single
