worker_processes auto;

events {
    worker_connections 1024;
}

# --- 1. SSH 四层转发层 (处理 git clone 流量) ---
# 已加入柏林 Vodafone IP 白名单过滤
stream {
    upstream gitlab_ssh_backend {
        server 192.168.1.10:8022; 
    }

    server {
        listen 22; 
        proxy_pass gitlab_ssh_backend;
        proxy_connect_timeout 10s;
        proxy_timeout 1h;

        # --- [白名单配置开始] ---
        # 柏林 Vodafone (AS3209) 常用网段
        allow 95.88.0.0/13;
        allow 178.24.0.0/13;
        allow 2.200.0.0/13;
        allow 31.16.0.0/14;
        allow 82.82.0.0/15;

        # 允许内网访问
        allow 192.168.1.0/24;
        allow 127.0.0.1;

        # 拒绝其余所有国家/地区的扫描机器人
        deny all;
        # --- [白名单配置结束] ---
    }
}

# --- 2. HTTP/HTTPS 七层代理层 (处理网页流量) ---
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 日志配置
    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log;

    sendfile        on;
    keepalive_timeout  65;

    # 2.1 Home Assistant (ha.codingcats.io)
    server {
        listen 80;
        server_name ha.codingcats.io;

        location / {
            proxy_pass http://192.168.1.100:8123;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 支持 HA 的 WebSocket
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # 2.2 Home Monitor (homemonitor.codingcats.io)
    server {
        listen 80;
        server_name homemonitor.codingcats.io;

        location / {
            proxy_pass http://192.168.1.100:9280;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # 2.3 GitLab HTTPS (gitlab.codingcats.io)
    server {
        listen 443 ssl http2;
        server_name gitlab.codingcats.io;

        # 证书配置
        ssl_certificate /etc/letsencrypt/live/gitlab.codingcats.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/gitlab.codingcats.io/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        client_max_body_size 250m; 

        location / {
            proxy_pass http://192.168.1.10:8090; 
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 支持 GitLab WebSocket
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_read_timeout 300;
        }
    }

    # 2.4 默认兜底
    server {
        listen 80 default_server;
        server_name _;
        return 444; # 非法域名访问直接丢弃连接
    }
}

